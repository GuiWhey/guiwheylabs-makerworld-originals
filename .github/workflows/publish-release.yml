name: publish-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (also the _staging/<tag> directory and RELEASE_NOTES_<tag>.md)
        required: true
        default: batch-01
      title:
        description: Release title
        required: true
        default: Batch 01 - first four original packages

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble zips and create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/reassemble_release.py "$TAG"
          ls -lh dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "${{ inputs.title }}" \
              --notes-file "RELEASE_NOTES_${TAG}.md"
          fi
          gh release view "$TAG"
