name: publish-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: batch-01
      title:
        description: Release title
        required: true
        default: Batch 01 - first four original packages

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble zips and create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/reassemble_release.py
          ls -lh dist
          if gh release view "${{ inputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ inputs.tag }}" dist/*.zip --clobber
          else
            gh release create "${{ inputs.tag }}" dist/*.zip \
              --title "${{ inputs.title }}" \
              --notes-file RELEASE_NOTES_batch-01.md
          fi
          gh release view "${{ inputs.tag }}"
